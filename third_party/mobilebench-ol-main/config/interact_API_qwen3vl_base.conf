# MobileBench-OL × 托管 API（阿里云百炼）开箱配置
# 生成于 2026-09-18，配套补丁：python experiments/scripts/mbl_apply_api_patch.py --with-retry --coord-norm
#
# 与官方 config/interact_qwen2_5vl_base.conf 的区别：
#   1) url 指向百炼的 OpenAI 兼容端点，不再是你自己的 vLLM
#   2) retry_rounds / fail_retry 都设为 1 —— 保证"一个任务一次尝试"，
#      这是顺序敏感（OD flaky）实验的测量前提
#   3) 真正的模型名不在这里，而在环境变量 MBL_MODEL（补丁读它）
#      —— 因为百炼的 /v1/models 会返回 255 个模型，data[0].id 会选成
#      qwen-mt-uni（翻译模型），必须显式指定。
#
# 需要的环境变量：
#   MBL_API_KEY=sk-xxxx                百炼 API Key
#   MBL_MODEL=qwen3-vl-plus            实测可用；qwen2.5-vl-7b-instruct 返回 403
#   MBL_COORD=norm                     ★ qwen3-vl-plus 输出 0-1000 归一化坐标，
#                                        不设这个所有点击都会挤到左上角
#   MBL_API_LOG=results/api_errors.jsonl   接口失败记录（防止抖动被误判成顺序效应）
#   MBL_TASK_FILE=data/xxx.csv         可选：覆盖要跑的任务集（需 --task-file-env 补丁）
#
# 注意：本文件里的 [task] task_file 是**死配置** —— run.py 的 interact 分支
# 用的是 get_task_file(args.subset)，从不读这一项。要换任务集请用 MBL_TASK_FILE。

[device]
id=GAGU8HGYW8JF9TIJ

[model]
name=qwen2_5vl
url=https://dashscope.aliyuncs.com/compatible-mode/v1

[retry]
retry_rounds=1
connect_retry=3
fail_retry=1

[reset]
reset=false

[operation]
max_steps=20
back_times=
sleep_seconds_per_act=3

[task]
task_file=data/MobileBench-OL - top12.csv
output=results/api_smoke
