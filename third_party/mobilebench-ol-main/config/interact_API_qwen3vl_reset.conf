# ============================================================================
#  reset 通道配置 —— 跑 benchmark 自带的 cleaner
#
#  MobileBench-OL 的 reset 是**独立的一趟**：用同一个 GUI agent 执行每个任务的
#  自然语言 `reset_query`（人工写的清理指令），再用 `reset_xpath` 验收。
#  见 mobilebench/utils/task_executor.py::TaskExecutor.run 的 reset 分支。
#
#  必须用这个配置跑，缺一不可：
#    1) [reset] reset=true          ← 切到 reset 分支
#    2) MBL_TASK_FILE 指向 *-reset.csv（里面才有 reset_query/reset_xpath 两列）
#    3) ★★ --output 必须用一个**独立目录** ★★
#       因为 reset CSV 的 task_identifier 与主任务集**完全相同**（reset 集是主集的子集），
#       共用 output 会让主运行的 result_list.txt 缓存把这 65 个任务当成"已完成"直接跳过！
#
#  用法：
#     $env:MBL_TASK_FILE='data/top12-reset.csv'
#     & run_mbl.ps1 -Config config/interact_API_qwen3vl_reset.conf -Output results/reset1
#
#  跑完看通过率：reset 通道本身也是 agent 执行的，官方报告成功率 >90%，即约有 10% 清不干净
#  —— 这个数字本身就是要写进论文的"cleaner 可靠性"。
# ============================================================================

[device]
id=GAGU8HGYW8JF9TIJ

[model]
name=qwen2_5vl
url=https://dashscope.aliyuncs.com/compatible-mode/v1

[retry]
retry_rounds=1
connect_retry=3
fail_retry=1

[reset]
reset=true

[operation]
max_steps=20
back_times=
sleep_seconds_per_act=3

[task]
task_file=data/top12-reset.csv
output=results/reset1
