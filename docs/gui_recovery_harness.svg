<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrow-solid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4B5563"/>
    </marker>
    <marker id="arrow-dash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#6B7280"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#FFFFFF"/>

  <!-- ===================== SECTION BACKGROUNDS ===================== -->
  <!-- 污染检测 -->
  <rect x="20" y="55" width="360" height="470" rx="8" fill="#FFF5F5" stroke="#FCA5A5" stroke-width="1.5"/>
  <text x="200" y="88" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#991B1B">污染检测</text>

  <!-- Harness 控制核心 -->
  <rect x="400" y="55" width="580" height="470" rx="8" fill="#FFF5F5" stroke="#FCA5A5" stroke-width="1.5"/>
  <text x="690" y="88" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#991B1B">Harness 控制核心</text>

  <!-- 执行与验证 -->
  <rect x="1000" y="55" width="580" height="470" rx="8" fill="#FFF5F5" stroke="#FCA5A5" stroke-width="1.5"/>
  <text x="1290" y="88" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#991B1B">执行与验证</text>

  <!-- 终止条件 -->
  <rect x="400" y="560" width="800" height="170" rx="8" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="800" y="593" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#374151">终止条件</text>

  <!-- ===================== LEFT: 污染检测 ===================== -->
  <!-- 任务轨迹 -->
  <rect x="50" y="120" width="300" height="60" rx="6" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.5"/>
  <g transform="translate(62,132)">
    <rect x="0" y="2" width="18" height="22" rx="2" fill="none" stroke="#B91C1C" stroke-width="1.5"/>
    <line x1="3" y1="8" x2="15" y2="8" stroke="#B91C1C" stroke-width="1.2"/>
    <line x1="3" y1="13" x2="15" y2="13" stroke="#B91C1C" stroke-width="1.2"/>
    <line x1="3" y1="18" x2="11" y2="18" stroke="#B91C1C" stroke-width="1.2"/>
  </g>
  <text x="220" y="153" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="700" fill="#1F2937">任务轨迹</text>

  <!-- 审计 -->
  <rect x="120" y="225" width="160" height="50" rx="6" fill="#991B1B" stroke="#7F1D1D" stroke-width="1.5"/>
  <text x="200" y="256" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">审计</text>

  <!-- 污染清单 -->
  <rect x="50" y="320" width="300" height="60" rx="6" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.5"/>
  <g transform="translate(62,332)">
    <rect x="0" y="2" width="18" height="22" rx="2" fill="none" stroke="#B91C1C" stroke-width="1.5"/>
    <line x1="3" y1="8" x2="15" y2="8" stroke="#B91C1C" stroke-width="1.2"/>
    <line x1="3" y1="13" x2="15" y2="13" stroke="#B91C1C" stroke-width="1.2"/>
    <line x1="3" y1="18" x2="11" y2="18" stroke="#B91C1C" stroke-width="1.2"/>
  </g>
  <text x="220" y="353" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="700" fill="#1F2937">污染清单</text>

  <!-- ===================== CENTER: Harness 控制核心 ===================== -->
  <!-- 恢复状态 -->
  <rect x="500" y="115" width="380" height="60" rx="6" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.5"/>
  <g transform="translate(512,127)">
    <ellipse cx="11" cy="13" rx="10" ry="10" fill="none" stroke="#B91C1C" stroke-width="1.5"/>
    <ellipse cx="11" cy="13" rx="4" ry="4" fill="none" stroke="#B91C1C" stroke-width="1.2"/>
    <line x1="11" y1="3" x2="11" y2="0" stroke="#B91C1C" stroke-width="1.2"/>
    <line x1="11" y1="23" x2="11" y2="26" stroke="#B91C1C" stroke-width="1.2"/>
    <line x1="1" y1="13" x2="-2" y2="13" stroke="#B91C1C" stroke-width="1.2"/>
    <line x1="21" y1="13" x2="24" y2="13" stroke="#B91C1C" stroke-width="1.2"/>
  </g>
  <text x="700" y="148" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="700" fill="#1F2937">恢复状态</text>

  <!-- 策略引擎 (视觉中心) -->
  <rect x="520" y="250" width="340" height="85" rx="8" fill="#991B1B" stroke="#7F1D1D" stroke-width="2"/>
  <g transform="translate(545,270)">
    <circle cx="18" cy="18" r="10" fill="none" stroke="#FFFFFF" stroke-width="1.8"/>
    <circle cx="18" cy="18" r="3.5" fill="#FFFFFF"/>
    <g stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round">
      <line x1="18" y1="2" x2="18" y2="6"/>
      <line x1="18" y1="30" x2="18" y2="34"/>
      <line x1="2" y1="18" x2="6" y2="18"/>
      <line x1="30" y1="18" x2="34" y2="18"/>
      <line x1="6.7" y1="6.7" x2="9.5" y2="9.5"/>
      <line x1="26.5" y1="26.5" x2="29.3" y2="29.3"/>
      <line x1="29.3" y1="6.7" x2="26.5" y2="9.5"/>
      <line x1="9.5" y1="26.5" x2="6.7" y2="29.3"/>
    </g>
  </g>
  <text x="710" y="300" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">策略引擎</text>

  <!-- 策略引擎下方四个可行动作 -->
  <rect x="420" y="395" width="110" height="52" rx="6" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1.5"/>
  <text x="475" y="426" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="600" fill="#991B1B">规划器</text>

  <rect x="545" y="395" width="110" height="52" rx="6" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1.5"/>
  <text x="600" y="426" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="600" fill="#991B1B">重新审计</text>

  <rect x="670" y="395" width="110" height="52" rx="6" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1.5"/>
  <text x="725" y="426" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="600" fill="#991B1B">观察</text>

  <rect x="795" y="395" width="110" height="52" rx="6" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1.5"/>
  <text x="850" y="426" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="600" fill="#991B1B">验证</text>

  <!-- ===================== RIGHT: 执行与验证 ===================== -->
  <!-- 规划器 -->
  <rect x="1070" y="115" width="130" height="48" rx="6" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1.5"/>
  <text x="1135" y="145" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="600" fill="#991B1B">规划器</text>

  <!-- 执行 -->
  <rect x="1070" y="205" width="130" height="58" rx="6" fill="#991B1B" stroke="#7F1D1D" stroke-width="2"/>
  <g transform="translate(1082,219)">
    <path d="M4,2 L18,12 L4,22 Z" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linejoin="round"/>
  </g>
  <text x="1150" y="240" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">执行</text>

  <!-- 动作约束 -->
  <rect x="1280" y="210" width="180" height="48" rx="6" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.5"/>
  <g transform="translate(1292,219)">
    <path d="M12,1 L22,5 V12 C22,17 17,21 12,23 C7,21 2,17 2,12 V5 Z" fill="none" stroke="#B91C1C" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M8.5,12 L11,14.5 L15.5,9.5" fill="none" stroke="#B91C1C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="1370" y="240" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="600" fill="#991B1B">动作约束</text>

  <!-- 观察 -->
  <rect x="1070" y="300" width="130" height="48" rx="6" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1.5"/>
  <g transform="translate(1082,312)">
    <ellipse cx="11" cy="11" rx="9" ry="7" fill="none" stroke="#B91C1C" stroke-width="1.5"/>
    <circle cx="11" cy="11" r="3" fill="#B91C1C"/>
  </g>
  <text x="1135" y="330" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="600" fill="#991B1B">观察</text>

  <!-- 验证 -->
  <rect x="1070" y="390" width="130" height="48" rx="6" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1.5"/>
  <g transform="translate(1082,400)">
    <circle cx="11" cy="11" r="10" fill="none" stroke="#B91C1C" stroke-width="1.5"/>
    <path d="M6,11 L10,15 L16,7" fill="none" stroke="#B91C1C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="1135" y="420" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="600" fill="#991B1B">验证</text>

  <!-- ===================== 终止条件 ===================== -->
  <!-- 成功 -->
  <rect x="470" y="615" width="180" height="80" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <g transform="translate(490,635)">
    <circle cx="16" cy="16" r="14" fill="#059669"/>
    <path d="M9,16 L14,21 L23,11" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="575" y="660" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="700" fill="#065F46">成功</text>

  <!-- 失败 -->
  <rect x="690" y="615" width="180" height="80" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <g transform="translate(710,635)">
    <circle cx="16" cy="16" r="14" fill="#DC2626"/>
    <path d="M10,10 L22,22 M22,10 L10,22" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <text x="795" y="660" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="700" fill="#991B1B">失败</text>

  <!-- 人工审核 -->
  <rect x="910" y="615" width="200" height="80" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <g transform="translate(930,635)">
    <circle cx="16" cy="16" r="14" fill="#D97706"/>
    <text x="16" y="22" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">?</text>
  </g>
  <text x="1020" y="660" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="700" fill="#92400E">人工审核</text>

  <!-- ===================== 箭头：数据流 (实线) ===================== -->
  <!-- 任务轨迹 -> 审计 -->
  <line x1="200" y1="180" x2="200" y2="225" stroke="#4B5563" stroke-width="1.8" marker-end="url(#arrow-solid)"/>

  <!-- 审计 -> 污染清单 -->
  <line x1="200" y1="275" x2="200" y2="320" stroke="#4B5563" stroke-width="1.8" marker-end="url(#arrow-solid)"/>

  <!-- 污染清单 -> 策略引擎 (仅本任务) -->
  <path d="M 350,350 L 470,350 L 470,292 L 520,292" fill="none" stroke="#4B5563" stroke-width="1.8" marker-end="url(#arrow-solid)"/>

  <!-- 规划器 (右) -> 执行 -->
  <line x1="1135" y1="163" x2="1135" y2="205" stroke="#4B5563" stroke-width="1.8" marker-end="url(#arrow-solid)"/>

  <!-- 执行 -> 观察 -->
  <line x1="1135" y1="263" x2="1135" y2="300" stroke="#4B5563" stroke-width="1.8" marker-end="url(#arrow-solid)"/>

  <!-- 观察 -> 验证 -->
  <line x1="1135" y1="348" x2="1135" y2="390" stroke="#4B5563" stroke-width="1.8" marker-end="url(#arrow-solid)"/>

  <!-- 验证 -> 终止条件 (已验证状态) -->
  <path d="M 1135,438 L 1135,470 L 800,470 L 800,560" fill="none" stroke="#4B5563" stroke-width="1.8" marker-end="url(#arrow-solid)"/>

  <!-- ===================== 箭头：控制流 (虚线) ===================== -->
  <!-- 恢复状态 -> 策略引擎 -->
  <line x1="690" y1="175" x2="690" y2="250" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow-dash)"/>

  <!-- 策略引擎 -> 恢复状态 (反馈) -->
  <line x1="760" y1="250" x2="760" y2="175" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow-dash)"/>

  <!-- 策略引擎 -> 四个动作选项 -->
  <line x1="560" y1="335" x2="475" y2="395" stroke="#6B7280" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-dash)"/>
  <line x1="630" y1="335" x2="600" y2="395" stroke="#6B7280" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-dash)"/>
  <line x1="750" y1="335" x2="725" y2="395" stroke="#6B7280" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-dash)"/>
  <line x1="820" y1="335" x2="850" y2="395" stroke="#6B7280" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-dash)"/>

  <!-- 四个动作选项 -> 恢复状态 (更新状态) -->

  <!-- 策略引擎 -> 右侧模块 (下一步行动) -->
  <path d="M 860,292 L 960,292 L 960,140 L 1070,140" fill="none" stroke="#6B7280" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#arrow-dash)"/>

  <!-- 执行 -> 观察 侧路也通向右侧规划器 -->
  <path d="M 960,292 L 960,234 L 1070,234" fill="none" stroke="#6B7280" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#arrow-dash)"/>

  <!-- 动作约束 <-> 执行 (检查 / 允许) -->
  <line x1="1280" y1="234" x2="1200" y2="234" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow-dash)"/>

  <!-- 右侧验证 -> 策略引擎 (结果 / 反馈) -->
  <path d="M 1200,414 L 1490,414 L 1490,292 L 860,292" fill="none" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow-dash)"/>

  <!-- 重新审计 -> 回到污染清单/审计 (重新审计回路) -->

  <!-- ===================== 图例 ===================== -->
  <rect x="20" y="560" width="360" height="170" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/>
  <text x="40" y="590" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="700" fill="#374151">图例</text>
  <line x1="40" y1="615" x2="100" y2="615" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow-solid)"/>
  <text x="115" y="619" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#4B5563">数据流</text>
  <line x1="40" y1="645" x2="100" y2="645" stroke="#6B7280" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-dash)"/>
  <text x="115" y="649" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#6B7280">控制流</text>
  <rect x="40" y="668" width="22" height="16" rx="3" fill="#991B1B"/>
  <text x="70" y="681" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#374151">决策 / 动作核心</text>
  <rect x="40" y="695" width="22" height="16" rx="3" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1.5"/>
  <text x="70" y="708" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#374151">辅助模块</text>

</svg>
